name: Build GTalk Flutter
# Publishes a GitHub release (tag v<version from flutter/pubspec.yaml>) from the default
# branch when none exists yet. Existing releases are never overwritten.
on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      publish: ${{ steps.exists.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: ver
        run: |
          v=$(grep -m1 '^version:' flutter/pubspec.yaml | sed -E 's/^version:\s*([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "bad version '$v'"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Check whether release exists
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${{ github.ref_name }}" != "main" && "${{ github.ref_name }}" != "master" ]]; then echo "publish=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          if out=$(gh release view "v${{ steps.ver.outputs.version }}" --json tagName 2>&1); then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif grep -qiE 'release not found|HTTP 404|Not Found' <<<"$out"; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "$out"; exit 1
          fi
  build-android:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: GTalk-Android
          path: flutter/build/app/outputs/flutter-apk/app-release.apk

  build-ios:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    runs-on: macos-latest
    defaults:
      run:
        working-directory: flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - name: Package IPA
        run: |
          mkdir Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r GTalk-iOS-Flutter.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: GTalk-iOS-Flutter
          path: flutter/GTalk-iOS-Flutter.ipa

  build-windows:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    runs-on: windows-latest
    defaults:
      run:
        working-directory: flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Bundle VC++ Runtime
        run: |
          copy "C:\Windows\System32\msvcp140.dll" "build\windows\x64\runner\Release\"
          copy "C:\Windows\System32\vcruntime140.dll" "build\windows\x64\runner\Release\"
          copy "C:\Windows\System32\vcruntime140_1.dll" "build\windows\x64\runner\Release\"
      - name: Compile Inno Setup Installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" windows_setup.iss
      - uses: actions/upload-artifact@v4
        with:
          name: GTalk-Windows-Flutter
          path: flutter/build/GTalk-Flutter-Setup.exe

  build-linux:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
      - run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - run: flutter pub get
      - run: flutter build linux --release
      - name: Package Tarball
        run: |
          tar -czf GTalk-Linux-Flutter.tar.gz -C build/linux/x64/release/bundle .
      - uses: actions/upload-artifact@v4
        with:
          name: GTalk-Linux-Flutter
          path: flutter/GTalk-Linux-Flutter.tar.gz

  build-macos:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    runs-on: macos-latest
    defaults:
      run:
        working-directory: flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
      - run: flutter pub get
      - run: flutter build macos --release
      - name: Create DMG
        run: |
          mkdir dmg_contents
          cp -r build/macos/Build/Products/Release/gtalk.app dmg_contents/
          hdiutil create -volname "GTalk" -srcfolder dmg_contents -ov -format UDZO GTalk-macOS-Flutter.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: GTalk-macOS-Flutter
          path: flutter/GTalk-macOS-Flutter.dmg

  release:
    if: needs.prepare.outputs.publish == 'true'
    needs: [prepare, build-android, build-ios, build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
      - name: List artifacts
        run: find . -type f | head -20
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          name: GTalk ${{ needs.prepare.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            GTalk-Android/app-release.apk
            GTalk-iOS-Flutter/GTalk-iOS-Flutter.ipa
            GTalk-Windows-Flutter/GTalk-Flutter-Setup.exe
            GTalk-Linux-Flutter/GTalk-Linux-Flutter.tar.gz
            GTalk-macOS-Flutter/GTalk-macOS-Flutter.dmg
